name: iOS client and TestFlight

on:
  pull_request:
  workflow_dispatch:
    inputs:
      inspect_only:
        description: Read Apple build processing and testing-group status only
        type: boolean
        default: false
      upload_testflight:
        description: Archive and upload to TestFlight after validation
        type: boolean
        default: false
      bundle_id:
        description: Registered Apple bundle ID (required for TestFlight)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ !inputs.inspect_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npx playwright install --with-deps chromium webkit
      - name: Chromium mobile behavioral regressions
        run: npm run test:mobile
        env:
          LH_MOBILE_ARTIFACTS: ${{ runner.temp }}/mobile-chromium
      - name: WebKit mobile behavioral regressions
        run: npm run test:mobile
        env:
          LH_BROWSER: webkit
          LH_MOBILE_ARTIFACTS: ${{ runner.temp }}/mobile-webkit
      - name: Save browser regression evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-browser-evidence
          path: ${{ runner.temp }}/mobile-*
      - run: npm run mobile:build

  native-smoke:
    if: ${{ !inputs.inspect_only }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - run: npm ci
      - run: gem install xcodeproj -v 1.27.0 --no-document
      - name: Run bundled synthetic WKWebView UI tests on iPhone simulator
        run: bash tests/ios/run.sh
      - name: Save native test results and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-native-smoke
          path: |
            ${{ runner.temp }}/lh-ios-smoke/MobileSmoke.xcresult
            ${{ runner.temp }}/lh-ios-smoke/devices.json
          if-no-files-found: warn

  ios:
    needs: [validate, native-smoke]
    runs-on: macos-26
    timeout-minutes: 60
    env:
      LH_IOS_APP_ID: ${{ inputs.bundle_id || vars.IOS_BUNDLE_ID || 'com.paperfront.learnharness' }}
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - name: Build bundled interface and prepare native project
        run: |
          npm run mobile:build
          if [ ! -d ios/App/App.xcodeproj ]; then npx cap add ios; fi
          npx cap sync ios
          python3 scripts/ios-prepare.py
      - name: Verify unsigned simulator build
        run: |
          xcodebuild build -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ios-simulator" CODE_SIGNING_ALLOWED=NO
      - name: Install App Store Connect key
        if: github.event_name == 'workflow_dispatch' && inputs.upload_testflight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then echo "::error::Missing repository secret: $name"; exit 1; fi
          done
          if [[ "$LH_IOS_APP_ID" == com.example.* ]]; then
            echo '::error::Set IOS_BUNDLE_ID or supply the registered bundle_id input.'; exit 1
          fi
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          umask 077
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
      - name: Archive and export signed IPA
        if: github.event_name == 'workflow_dispatch' && inputs.upload_testflight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/ios-archive.sh
      - name: Upload to TestFlight
        if: github.event_name == 'workflow_dispatch' && inputs.upload_testflight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("$RUNNER_TEMP"/ipa/*.ipa)
          if [ "${#files[@]}" -ne 1 ]; then echo 'Expected exactly one exported IPA'; exit 1; fi
          xcrun altool --upload-app --type ios --file "${files[0]}" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Save IPA
        if: always() && github.event_name == 'workflow_dispatch' && inputs.upload_testflight
        uses: actions/upload-artifact@v7
        with:
          name: learnharness-ios-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove temporary API key
        if: always() && github.event_name == 'workflow_dispatch' && inputs.upload_testflight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          if [ -n "$ASC_KEY_ID" ]; then
            rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          fi

  inspect:
    if: github.event_name == 'workflow_dispatch' && inputs.inspect_only
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Read Apple processing and group assignment
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: node scripts/ios-status.mjs
